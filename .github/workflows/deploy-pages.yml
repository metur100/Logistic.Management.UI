name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Cloudflare diagnostics
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "token_chars=${#CLOUDFLARE_API_TOKEN}"
            echo "account_chars=${#CLOUDFLARE_ACCOUNT_ID}"
            echo "--- whoami ---"
            npx --yes wrangler@3 whoami 2>&1 || true
            echo "--- projects ---"
            npx --yes wrangler@3 pages project list 2>&1 || true
          } | tee cloudflare-diagnostics.txt

      - name: Deploy to Cloudflare Pages
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=logistic-management-ui --branch=master

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-diagnostics
          path: cloudflare-diagnostics.txt
          if-no-files-found: ignore

      - name: Fail if deploy failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
